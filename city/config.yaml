# Конфигурация попытки «Город дронов».
#
# ЭТО ЕДИНСТВЕННЫЙ ФАЙЛ, КОТОРЫЙ ПРАВЯТ НА ПЛОЩАДКЕ.
# Всё, что помечено ГИПОТЕЗА, проверяется рулеткой и глазами в первый день;
# всё, что помечено ПОДТВЕРЖДЕНО, взято из нашей карты поля docs/field-map/.
#
# Клетка везде записывается как [col, row], 0-based: col вдоль X, row вдоль Y.

field:
  size: [6, 6]        # 6x6 клеток (регламент 2.3.2.2) — ПОДТВЕРЖДЕНО регламентом
  cell: 0.8           # сторона клетки, м — ПОДТВЕРЖДЕНО регламентом
  origin:             # якорь: где центр поля в системе координат map
    x0: 0.0           # ПОДТВЕРЖДЕНО: начало map = центр квадрата маркеров = центр поля
    y0: 0.0
    yaw: 0.0          # поворот поля относительно map, рад

cells:
  charge: [3, 3]      # ГИПОТЕЗА (docs/openclaw/02): станция зарядки = стартовая зона
  rover_start: [3, 3] # ГИПОТЕЗА: ровер стартует в зоне зарядки
  tower: [1, 3]       # ГИПОТЕЗА (docs/openclaw/02): водонапорная башня
  pads: [[1, 1], [4, 1], [1, 4], [4, 4]]   # ПОДТВЕРЖДЕНО docs/field-map/map.txt
  # Высоты падов по карте (ревизия 2 от 2026-07-28): [1,1] и [4,1] (id 62 и 7)
  # на z=0.825 м, [1,4] и [4,4] (id 50 и 60) на z=0.515 м. Поле разновысотное,
  # на полу не лежит ни один пад; здесь высота не хранится — взлёт бортового
  # агента идёт в frame_id="body", то есть от своего же пада.
  # Клетки, куда роверу нельзя: дома. Пады — крыши домов, поэтому они тоже здесь;
  # ненулевая высота всех четырёх это подтверждает.
  # Три дома без маркеров — ГИПОТЕЗА docs/openclaw/02, пересчитать по макету.
  buildings: [[1, 1], [4, 1], [1, 4], [4, 4], [3, 1], [4, 2], [2, 4]]

aruco:
  dict: DICT_4X4_1000 # ПОДТВЕРЖДЕНО: id 60 и 62 не влезают в DICT_4X4_50
  size: 0.25          # ПОДТВЕРЖДЕНО docs/field-map/map.txt, сторона маркера, м
  # id маркера -> клетка пада. ПОДТВЕРЖДЕНО docs/field-map/map.txt.
  # Гипотеза OpenClaw про id 51-54 и 29 см опровергнута нашей картой.
  pads:
    "50": [1, 4]
    "60": [4, 4]
    "62": [1, 1]
    "7": [4, 1]

camera:
  # Угол обзора по горизонтали, градусы. Нужен, только когда метки в кадре нет:
  # по нему считается, сколько метров поля укладывается в кадр.
  # ГИПОТЕЗА — измерить в первый день: поднять дрон на известную высоту над
  # предметом известной длины и посмотреть, какую долю кадра он занял.
  fov_deg: 65.0

survey:               # облёт поля дронами-мониторами (этап 3)
  # Высота съёмки, м. Выше — шире кадр, но мельче «огонёк»: жетон 4,5 см перестаёт
  # опознаваться примерно с 3 м даже на идеальной картинке, а на живой камере с
  # шевелёнкой раньше. 1,5 м — кадр около 1,9 м, поэтому нужен облёт (ниже).
  # 2,5 м дают кадр 3,2 м — это весь угол дрона разом, и второй проход обычно не
  # понадобится; пробовать на площадке, глядя на размер пятна в логе.
  alt: 1.5
  second_pass: true   # если с площадок очаг не виден — облетать точки обзора
  stop_when_found: true  # нашли очаг — облёт прекращается, время попытки дороже
  # Точки обзора: смещение от своей метки в метрах, ПЛЮС значит «в сторону центра
  # поля» (диспетчер сам разворачивает знаки под угол каждого дрона). Между точками
  # дрон обязательно возвращается на метку: там локализация по ArUco самая надёжная.
  offsets: [[0.5, 0.5], [0.5, -0.5], [-0.5, 0.5], [-0.5, -0.5]]

vision:               # разбор кадра, city/vision.py
  # Куда на поле смотрит верхнее ребро метки: 0 — вдоль оси X. Влияет только на
  # случай «в кадре ровно одна метка». ГИПОТЕЗА: проверить одним кадром на площадке —
  # если найденная клетка повёрнута относительно настоящей, ставить 90, 180 или 270.
  marker_edge_deg: 0
  # Цвет «огонька» в HSV OpenCV (H 0..180). Два диапазона: красный лежит по обоим
  # краям круга. ЗАМЕРЕНО по фотографиям настоящего жетона (photo_fire/, 2026-07-28):
  # тон 176..181, насыщенность 120..250, яркость 55..190 — он ТЁМНО-КРАСНЫЙ, не
  # оранжевый. Высокая насыщенность отделяет его от розового района поля (S 15..43)
  # и от кожи рук в кадре (тон 10..15). Под другим светом проверить: python3 -m
  # city.vision кадр --debug
  fire_hsv: [[[0, 120, 40], [5, 255, 255]], [[170, 120, 40], [180, 255, 255]]]
  # Жетон ~4,5 см: с высоты 1,5 м это пятно около 600 пикселей. 150 — запас вчетверо.
  min_area_px: 150
  # Пятно крупнее этой доли кадра — это цветной РАЙОН поля, а не «огонёк».
  max_area_share: 0.15

districts:            # ГИПОТЕЗА (docs/openclaw/02): четыре цветных района по углам
  yellow: [0, 0]
  red: [5, 0]
  blue: [0, 5]
  green: [5, 5]

# Сценарий попытки: организаторы выставляют его перед заездом.
# Миссия у нас одна — «Пожар»: «Доставку» команда не выполняет (см. PLAN.md).
# КЛЕТКУ очага с этапа 3 находят дроны-мониторы по кадрам, и найденная побеждает
# записанную здесь. УРОВЕНЬ по картинке не определяется: на нашем поле пожар
# обозначен физическим «огоньком» без числа — значит уровень остаётся отсюда
# (или ключом --fire-level), а с этапа 7 его сможет прочитать VLM.
scenario:
  fire:
    cell: [4, 2]      # горящий дом: запасное значение, если облёт очага не нашёл
    level: 2          # сколько раз ехать за водой — задают организаторы
  person:
    cell: [4, 2]      # человек в окне горящего здания
    window: N

rules:                # регламент 2.3.2.3, менять нельзя без изменения регламента
  water_dwell: 3.0    # стоянка у башни, с
  energy_reserve: 2   # запас игрового заряда сверх расчётного плана
  max_alt: 4.0        # потолок полёта, м (регламент 2.6)

flags:
  use_drones: false   # этап 3: сцена из кадров вместо конфига
  use_vup: false      # микродрона у нас нет, см. PLAN.md «Чего у нас нет на руках»
  use_llm: false      # этап 7: включается ключом --llm

# Модель (этап 7). Она НИКОГДА не в цепи управления: предлагает — а решает
# city/rules.py. При любом сбое модели прогон идёт детерминированным путём,
# и это видно в логе событием LLM с ok=false.
llm:
  # mock — отвечает сам, без сети и без ключа: так проверяется вся обвязка там,
  # где интернета нет. Кадры mock НЕ смотрит и детекцию не выдумывает.
  # sverk — живой шлюз «Сверх», нужен ключ в окружении.
  provider: mock
  base: https://ai.sverk.tech/v1
  key_env: SVERK_API_KEY
  model: qwen35       # текстовая, семейство Qwen3
  vlm_model: gemma4-vlm  # умеет смотреть на картинку
  timeout: 30         # с; живая модель отвечает за 4-18 с (docs/openclaw/03)
  advise_plan: true   # предлагать клетку подъезда и бюджет заряда
  explain: true       # объяснять решения по-русски в лог
  see: true           # смотреть на кадры мониторов
  confirm_fire: true  # второе мнение по очагу, когда зрение не уверено

sim:
  move_time: 1.2      # сколько секунд ровер едет в соседнюю клетку (для мока)
  poll: 0.2           # период опроса /status
  # Где очаг стоит в НАРИСОВАННОМ мире (кадры понарошечных дронов). Если ключа нет —
  # там же, где scenario.fire.cell. Раскомментируйте с другой клеткой, чтобы
  # убедиться: диспетчер верит картинке, а не файлу настроек.
  # fire_cell: [1, 2]

robots:
  # fake — аппараты живут внутри программы диспетчера (мгновенно, для отладки логики);
  # http — команды уходят по сети: мокам с mock_server или настоящим бортам.
  # Переключается флагом --net, чтобы не править файл на площадке.
  transport: fake

  rover:
    url: http://127.0.0.1:8010
  vup:
    url: http://127.0.0.1:8011

  # Адреса ниже — моки с ноутбука (RUN.md п. 2). Живой борт зовётся http://<ip дрона>:2200:
  # бортовая программа сидит ВНУТРИ контейнера на порту 8020, а наружу этот порт проброшен
  # как 2200 (ssh на 22 тоже ведёт внутрь контейнера). Адрес дрона — выдача `hostname -I`
  # внутри контейнера. enabled: false — дрон в этой попытке не участвует.
  monitors:
    m1:
      url: http://127.0.0.1:8020
      pad: [1, 1]
      enabled: true
    m2:
      url: http://127.0.0.1:8021
      pad: [4, 1]
      enabled: true
    m3:
      url: http://127.0.0.1:8022
      pad: [1, 4]
      enabled: true
    m4:
      url: http://127.0.0.1:8023
      pad: [4, 4]
      enabled: true
